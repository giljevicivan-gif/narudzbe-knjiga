<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Narudžbe knjiga</title>
<style>
  :root { --plava: #1f5f99; --siva: #f3f4f6; --rub: #d1d5db; --crvena: #b91c1c; --zelena: #15803d; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.4 "Segoe UI", Arial, sans-serif; color: #111827; background: #fff; }
  header { background: var(--plava); color: #fff; display: flex; align-items: center; gap: 4px; padding: 0 12px; flex-wrap: wrap; }
  header b { margin-right: 16px; font-size: 17px; }
  header a { color: #fff; text-decoration: none; padding: 12px 12px; border-bottom: 3px solid transparent; }
  #razina { margin-left: auto; display: flex; border: 1px solid rgba(255,255,255,.6); border-radius: 8px; overflow: hidden; }
  #razina button { background: transparent; color: #fff; border: 0; border-radius: 0; padding: 6px 10px; cursor: pointer; font: inherit; }
  #razina button.aktivno { background: #fff; color: var(--plava); font-weight: 600; }
  header a.aktivno { border-bottom-color: #fff; font-weight: 600; }
  main { padding: 16px; max-width: 1200px; margin: 0 auto; }
  h2 { margin: 4px 0 12px; font-size: 20px; }
  .traka { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .traka .desno { margin-left: auto; display: flex; gap: 8px; }
  input, select, textarea, button { font: inherit; }
  input, select, textarea { padding: 6px 8px; border: 1px solid var(--rub); border-radius: 4px; background: #fff; }
  textarea { width: 100%; min-height: 60px; }
  button { padding: 6px 14px; border: 1px solid var(--rub); border-radius: 4px; background: #fff; cursor: pointer; }
  button:hover { background: var(--siva); }
  button.glavni { background: var(--plava); color: #fff; border-color: var(--plava); }
  button.opasno { color: var(--crvena); }
  button.mali { padding: 2px 8px; font-size: 13px; }
  a.mali { display: inline-block; padding: 2px 8px; font-size: 13px; border: 1px solid var(--rub); border-radius: 4px; text-decoration: none; color: inherit; white-space: nowrap; background: #fff; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #e5e7eb; vertical-align: top; }
  th { background: var(--siva); font-weight: 600; position: sticky; top: 0; }
  tr.klik:hover { background: #eef5fc; cursor: pointer; }
  td.br, th.br { text-align: right; white-space: nowrap; }
  .polja { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px 16px; margin-bottom: 14px; }
  .polja label { display: flex; flex-direction: column; font-size: 13px; color: #4b5563; gap: 3px; }
  .polja label.sirok { grid-column: 1 / -1; }
  .okvir { border: 1px solid var(--rub); border-radius: 6px; padding: 12px; margin-bottom: 14px; }
  .status { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 13px; background: #fef3c7; }
  .status.stiglo { background: #dbeafe; }
  .status.preuzeto { background: #dcfce7; }
  .status.otkazano { background: #fee2e2; text-decoration: line-through; }
  .znacka { display: inline-block; padding: 0 6px; border-radius: 8px; font-size: 12px; background: #dcfce7; color: #166534; margin-left: 4px; }
  .znacka.crvena { background: #fee2e2; color: #991b1b; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 50; display: flex; align-items: center; justify-content: center; }
  .modal-okvir { background: #fff; border-radius: 10px; padding: 16px; width: min(1100px, 95vw); height: 85vh; display: flex; flex-direction: column; }
  @media print { .modal { display: none; } }
  .obrazac { page-break-after: always; font-size: 10.5px; line-height: 1.25; }
  .obrazac h3 { margin: 6px 0; font-size: 14px; }
  .obrazac table { width: 100%; border-collapse: collapse; }
  .obrazac th, .obrazac td { border-bottom: 1px solid #999; padding: 1px 3px; vertical-align: top; }
  .obrazac tr.predmet td { font-weight: 700; border-bottom: 1.2px solid #000; padding-top: 3px; }
  .obrazac tr, .odrezak, .polja-o { page-break-inside: avoid; }
  .obrazac .kvc { width: 18px; }
  .kv { display: inline-block; width: 11px; height: 11px; border: 1.3px solid #000; vertical-align: -2px; font-size: 10px; line-height: 10px; text-align: center; font-weight: 700; }
  .crta { display: inline-block; border-bottom: 1px solid #000; height: 12px; vertical-align: bottom; }
  .polja-o { display: grid; grid-template-columns: 1.4fr 1fr; gap: 6px 16px; margin: 5px 0; }
  .odrezak { border-top: 1.5px dashed #000; margin-top: 10px; padding-top: 6px; position: relative; }
  .odrezak > span { position: absolute; top: -10px; left: -2px; background: #fff; font-size: 14px; }
  .logo { float: left; height: 68px; margin-right: 10px; }
  .logo.mali { height: 46px; }
  .listic svg { display: block; margin-top: 2px; }
  .naljepnice { display: grid; grid-template-columns: repeat(3, 70mm); grid-auto-rows: 37mm; width: 210mm; page-break-after: always; }
  .naljepnica { box-sizing: border-box; padding: 2.5mm 3.5mm; overflow: hidden; font-size: 10px; line-height: 1.2; }
  .naljepnica .br { font-size: 17px; font-weight: 700; }
  .naljepnica .ime { font-size: 12.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .naljepnica svg { display: block; margin-top: 1mm; }
  .naljepnice.rub .naljepnica { outline: 0.2mm dashed #bbb; }
  .skob { position: relative; width: 190mm; height: 276mm; page-break-after: always; font-size: 10.5px; line-height: 1.25; overflow: hidden; }
  .skob > div { position: absolute; }
  .skm { width: 6mm; height: 6mm; background: #000; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .skk { border: 0.35mm solid #000; background: #fff; }
  .skt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .skc { border-bottom: 0.2mm solid #999; height: 0; }
  .neaktivna { color: #9ca3af; }
  .zbroj { font-size: 17px; display: flex; gap: 24px; justify-content: flex-end; flex-wrap: wrap; margin: 10px 0; }
  .prijedlozi { border: 1px solid var(--rub); border-radius: 4px; max-height: 320px; overflow: auto; margin-top: 4px; }
  .prijedlozi div { padding: 5px 8px; cursor: pointer; border-bottom: 1px solid #f3f4f6; }
  .prijedlozi div:hover, .prijedlozi div.odabran { background: #eef5fc; }
  .siv { color: #6b7280; font-size: 13px; }
  #poruka { position: fixed; bottom: 16px; right: 16px; padding: 10px 16px; border-radius: 6px; color: #fff; display: none; z-index: 10; }
  #ispis { display: none; }
  @page { size: A4; margin: 9mm; }
  @media print {
    header, main, #poruka, #nadBanner, #upozBanner, #bazaBanner { display: none !important; }
    #ispis { display: block; font-size: 12px; }
    #ispis table { margin: 6px 0; }
    #ispis th { background: none; border-bottom: 1px solid #000; }
    .listic { page-break-after: always; }
  }
</style>
</head>
<body>
<header>
  <b>📚 Narudžbe knjiga <small id="verzijaZag" style="font-weight:normal;opacity:.75;font-size:12px"></small></b>
  <a href="#danas">Danas</a>
  <a href="#narudzbe">Narudžbe</a>
  <a href="#nova">+ Nova narudžba</a>
  <a href="#predbiljezbe">Predbilježbe <span id="brPred" class="znacka crvena" style="display:none"></span></a>
  <a href="#stiglo">Stiglo</a>
  <a href="#nakladnici">Nakladnici</a>
  <a href="#kompleti">Kompleti</a>
  <a href="#knjige">Knjige</a>
  <a href="#rabljene">Rabljene</a>
  <a href="#statistika">Statistika</a>
  <a href="#postavke">Postavke</a>
  <span id="razina" title="Prikaži samo osnovne ili samo srednje škole (narudžbe, nakladnici, kompleti, zbirni popis)">
    <button data-r="">Sve</button><button data-r="OŠ">Osnovne</button><button data-r="SŠ">Srednje</button></span>
  <button id="zatvoriZag" onclick="zatvoriProgram()" title="Potpuno zatvara program (radi u pozadini i kad zatvorite preglednik)" style="margin-left:6px;background:#b91c1c;color:#fff;border:0;border-radius:6px;padding:5px 9px;font-weight:600;cursor:pointer;white-space:nowrap">⏻ Zatvori</button>
</header>
<div id="nadBanner" style="display:none;background:#fef3c7;border-bottom:2px solid #f59e0b;padding:10px 16px;font-size:16px"></div>
<div id="bazaBanner" style="display:none;background:#fee2e2;border-bottom:3px solid #b91c1c;padding:10px 16px;font-size:16px"></div>
<div id="upozBanner" style="display:none;background:#eff6ff;border-bottom:2px solid #93c5fd;padding:8px 16px"></div>
<main id="sadrzaj"></main>
<div id="ispis"></div>
<div id="poruka"></div>

<script>
const S = { skole: [], postavke: {}, statusi: [], godine: [], knjige: [], kompleti: [], filter: {} };
const $ = (sel, el = document) => el.querySelector(sel);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const kn = v => (Number(v) || 0).toLocaleString('hr-HR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
const broj = v => parseFloat(String(v).replace(',', '.')) || 0;
const datum = d => d ? d.split('-').reverse().join('.') + '.' : '';
const norm = s => String(s || '').toUpperCase();

const RAZINA_PUTOVI = ['/api/narudzbe', '/api/nepreuzeto', '/api/zbirno', '/api/narudzbenica/prijedlog', '/csv/narudzbe', '/csv/zbirno', '/api/platitelj', '/csv/platitelj'];
const sRazinom = put => S.razina && RAZINA_PUTOVI.includes(put.split('?')[0]) ? put + (put.includes('?') ? '&' : '?') + 'razina=' + encodeURIComponent(S.razina) : put;
async function api(put, podaci) {
  if (podaci === undefined) put = sRazinom(put);
  const r = await fetch(put, podaci === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(podaci) });
  const j = await r.json();
  if (!r.ok) { poruka(j.greska || 'Greška', true); throw new Error(j.greska); }
  return j;
}
/* Ispis: pričeka da se logo (i ostale slike) učitaju, inače ga preglednik zna izostaviti s papira */
async function ispisi() {
  const slike = [...document.querySelectorAll('#ispis img')].filter(i => !i.complete);
  await Promise.all(slike.map(i => new Promise(r => { i.addEventListener('load', r); i.addEventListener('error', r); setTimeout(r, 3000); })));
  window.print();
}
const zaglavljeIspisa = (desno = '') => `<div style="display:flex;justify-content:space-between"><div style="display:flow-root;flex:1;min-width:0"><img src="/logo.png" class="logo mali" alt="" onerror="this.remove()"><b>${esc(S.postavke.firma)}</b><br>${esc(S.postavke.adresa)} · tel. ${esc(S.postavke.telefon)}</div><div style="text-align:right">${desno}</div></div>`;
new Image().src = '/logo.png';  // učitaj logo unaprijed da je spreman za ispis
function poruka(tekst, greska) {
  const p = $('#poruka');
  p.textContent = tekst; p.style.background = greska ? 'var(--crvena)' : 'var(--zelena)'; p.style.display = 'block';
  clearTimeout(p._t); p._t = setTimeout(() => p.style.display = 'none', greska ? 6000 : 2500);
}
async function zatvoriProgram() {
  if (!confirm('Zatvoriti program? Predbilježbe s interneta neće raditi dok ga ponovno ne pokrenete.')) return;
  await api('/api/ugasi', {});
  document.body.innerHTML = '<p style="padding:40px;font-size:18px">Program je zatvoren. Ovu karticu preglednika možete zatvoriti.<br>Ponovno ga pokrenite ikonom "Narudžbe knjiga" na radnoj površini.</p>';
}
async function nadogradi(d) {
  const b = $('#nadBanner'); b.style.display = 'block'; b.textContent = '⏳ Nadograđujem program, pričekajte…';
  let r;
  try { r = await api('/api/nadogradnja', d); }
  catch (e) { b.innerHTML = '❌ Nadogradnja nije uspjela: ' + esc(e.message) + ' (stara verzija radi dalje)'; return; }
  b.textContent = `⏳ Pokrećem verziju ${r.verzija}…`;
  for (let i = 0; i < 60; i++) {
    await new Promise(ok => setTimeout(ok, 1000));
    try { const j = await (await fetch('/api/init')).json(); if (j.verzija === r.verzija) return location.reload(); } catch (e) { }
  }
  b.textContent = 'Program se nije ponovno pokrenuo. Pokrenite ga ikonom "Narudžbe knjiga" na radnoj površini.';
}
async function provjeriNadogradnju() {
  try {
    const r = await (await fetch('/api/nadogradnja')).json();
    const b = $('#nadBanner');
    if (!r.dostupna) return;
    b.innerHTML = `🆕 Pronađena je nova verzija programa <b>${esc(r.dostupna.verzija)}</b> (${esc(r.dostupna.ime)}). <button class="glavni" id="nadSad">Nadogradi sad</button>`;
    b.style.display = 'block';
    $('#nadSad').onclick = () => nadogradi(r.dostupna.github ? { github: true } : {});
  } catch (e) { }
}
/* Upozorenja kod pokretanja: cijene različite od Vulpesa, knjige bez barkoda/cijene, nova Vulpes godina */
async function prikaziUpozorenja() {
  const danas = new Date().toLocaleDateString('sv-SE');
  try { if (localStorage.getItem('upozorenjaSkrivena') === danas) return; } catch { }
  let u; try { u = await (await fetch('/api/upozorenja')).json(); } catch { return; }
  const b = $('#upozBanner'), dijelovi = [];
  if (u.vulpes_mapa) dijelovi.push(`U Vulpesu postoji nova godina: <b>${esc(u.vulpes_mapa)}</b> <button class="mali glavni" id="uVulpes">Prebaci na nju</button>`);
  if (u.cijene) dijelovi.push(`<b>${u.cijene}</b> knjiga ima drugačiju cijenu u Vulpesu <button class="mali glavni" id="uCijene">Preuzmi sve cijene iz Vulpesa</button> <button class="mali" id="uPogledaj">Pogledaj</button>`);
  if (u.bez_barkoda) dijelovi.push(`<b>${u.bez_barkoda}</b> knjiga u kompletima nema barkod <button class="mali" id="uBarkod">Poveži s Vulpesom</button>`);
  if (u.bez_cijene) dijelovi.push(`<b>${u.bez_cijene}</b> knjiga u kompletima nema cijenu`);
  if (!dijelovi.length) { b.style.display = 'none'; return; }
  b.innerHTML = `<div style="display:flex;gap:6px 18px;flex-wrap:wrap;align-items:center">ℹ️ ${dijelovi.join('<span class="siv">·</span>')}
    <button class="mali" id="uSakrij" style="margin-left:auto">Sakrij do sutra</button></div>`;
  b.style.display = 'block';
  $('#uSakrij').onclick = () => { try { localStorage.setItem('upozorenjaSkrivena', danas); } catch { } b.style.display = 'none'; };
  if ($('#uVulpes')) $('#uVulpes').onclick = async () => {
    S.postavke = await api('/api/postavke', { vulpes_artikli: u.vulpes_mapa }); poruka('Vulpes mapa promijenjena.'); prikaziUpozorenja();
  };
  if ($('#uCijene')) $('#uCijene').onclick = async () => {
    if (!confirm(`Preuzeti nove cijene iz Vulpesa za ${u.cijene} knjiga?`)) return;
    const r = await api('/api/vulpes/preuzmi', { sve: true, ids: [] });
    S.knjige = await api('/api/knjige'); poruka('Ažurirano ' + r.azurirano + ' cijena.'); prikaziUpozorenja();
  };
  if ($('#uPogledaj')) $('#uPogledaj').onclick = () => { location.hash = '#knjige'; setTimeout(usporedbaVulpes, 50); };
  if ($('#uBarkod')) $('#uBarkod').onclick = () => { location.hash = '#knjige'; setTimeout(() => usporedbaVulpes(true), 50); };
}
async function ucitajOsnovno() {
  Object.assign(S, await api('/api/init'));
  provjeriNadogradnju();
  if (!S.upozorenjaProvjerena) { S.upozorenjaProvjerena = true; prikaziUpozorenja(); }
  osvjeziBrojPred();
  $('#verzijaZag').textContent = 'v' + S.verzija;
  if (S.baza_greska) {
    $('#bazaBanner').innerHTML = `⚠️ <b>Baza podataka nije ispravna</b> (${esc(S.baza_greska)}). Ne upisujte ništa novo – idite u
      <a href="#postavke">Postavke → Sigurnosne kopije</a> i vratite zadnju ispravnu kopiju (ili nazovite pomoć).`;
    $('#bazaBanner').style.display = 'block';
  } else $('#bazaBanner').style.display = 'none';
  S.knjige = await api('/api/knjige');
  S.kompleti = await api('/api/kompleti');
}
const knjigaPoId = id => S.knjige.find(k => k.id === id);
const skolaOpcije = (odabrana, prazna = '— škola —') =>
  `<option value="">${prazna}</option>` + S.skole.filter(s => !S.razina || s.tip === S.razina || s.id == odabrana).map(s => `<option value="${s.id}" ${s.id == odabrana ? 'selected' : ''}>${esc(s.naziv)}</option>`).join('');
const statusOpcije = (odabran, prazna) =>
  (prazna ? `<option value="">${prazna}</option>` : '') + S.statusi.map(s => `<option ${s === odabran ? 'selected' : ''}>${s}</option>`).join('');
const godinaOpcije = odabrana => '<option value="">sve godine</option>' + S.godine.map(g => `<option ${g == odabrana ? 'selected' : ''}>${g}</option>`).join('');

async function novaSkola(select) {
  const naziv = prompt('Naziv nove škole:');
  if (!naziv) { select.value = ''; return; }
  const { id } = await api('/api/skola', { naziv });
  await ucitajOsnovno();
  select.innerHTML = skolaOpcije(id) + '<option value="+">+ nova škola…</option>';
}

/* Pretraga knjiga: katalog (naziv/barkod), a ako nema - Vulpes */
function trazilica(input, kutija, odabrano, { vulpes = true, katalog = true } = {}) {
  let lista = [], i = -1;
  const crtaj = () => {
    kutija.innerHTML = lista.map((r, n) => `<div class="${n === i ? 'odabran' : ''}" data-n="${n}">
      ${r.izvor === 'vulpes' ? '<span class="status">Vulpes</span> ' : ''}${esc(r.naziv)}
      <span class="siv">${esc(r.nakladnik || '')} ${esc(r.barkod || '')} · ${kn(r.cijena)}${r.izvor === 'vulpes' ? ' · stanje ' + r.stanje : ''}</span></div>`).join('');
    kutija.style.display = lista.length ? '' : 'none';
  };
  const odaberi = r => { input.value = ''; lista = []; crtaj(); odabrano(r); };
  input.addEventListener('input', () => {
    const q = norm(input.value.trim());
    if (q.length < 2 || !katalog) { lista = []; return crtaj(); }
    const rijeci = q.split(/\s+/);
    lista = S.knjige.filter(k => k.aktivna && (k.barkod === q || rijeci.every(w => norm(k.naziv + ' ' + k.autori + ' ' + k.nakladnik).includes(w)))).slice(0, 40);
    i = lista.length ? 0 : -1; crtaj();
  });
  input.addEventListener('keydown', async e => {
    if (e.key === 'ArrowDown') { i = Math.min(i + 1, lista.length - 1); crtaj(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { i = Math.max(i - 1, 0); crtaj(); e.preventDefault(); }
    else if (e.key === 'Enter') {
      e.preventDefault();
      if (i >= 0 && lista[i]) return odaberi(lista[i]);
      const q = input.value.trim();
      if (vulpes && q) {
        try { lista = (await api('/api/vulpes/trazi?q=' + encodeURIComponent(q))).map(v => ({ ...v, izvor: 'vulpes' })); } catch { return; }
        if (!lista.length) poruka('Nema u katalogu ni u Vulpesu: ' + q, true);
        if (lista.length === 1 && /^\d{8,}$/.test(q)) return odaberi(lista[0]);
        i = 0; crtaj();
      }
    } else if (e.key === 'Escape') { lista = []; crtaj(); }
  });
  kutija.addEventListener('click', e => { const d = e.target.closest('[data-n]'); if (d) odaberi(lista[+d.dataset.n]); });
  kutija.style.display = 'none';
  if (katalog) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'mali'; b.textContent = '📋 Otvori cijeli popis'; b.style.marginTop = '4px';
    b.onclick = () => cijeliPopis(odabrano, $('#skola') && $('#razred') && $('#skola').value && $('#skola').value !== '+'
      ? { skola: $('#skola').value, razred: $('#razred').value } : null);
    const s = document.createElement('select');
    s.style.marginLeft = '6px';
    s.innerHTML = '<option value="">📚 knjige nakladnika…</option>' +
      [...new Set(S.knjige.filter(k => k.aktivna).map(k => k.nakladnik).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'hr')).map(n => `<option>${esc(n)}</option>`).join('');
    s.onchange = () => { if (s.value) { cijeliPopis(odabrano, { nakladnik: s.value, tekst: '', skola: '', razred: '', vrsta: '' }); s.value = ''; } };
    kutija.after(b, s);
  }
}

/* Cijeli popis knjiga – kad se ne zna naziv: filtriranje po školi/razredu, nakladniku, vrsti */
function cijeliPopis(odabrano, pocetni) {
  const f = S.cpf || (S.cpf = { tekst: '', skola: '', razred: '', nakladnik: '', vrsta: '' });
  if (pocetni) Object.assign(f, pocetni);
  const nakladnici = [...new Set(S.knjige.filter(k => k.aktivna).map(k => k.nakladnik).filter(Boolean))].sort();
  const vrste = [...new Set(S.knjige.filter(k => k.aktivna).map(k => k.vrsta).filter(Boolean))].sort();

      || '<tr><td colspan="4" class="siv">Nema knjiga za taj filter.</td></tr>';

  };
  o.querySelectorAll('input,select').forEach(el => el[el.tagName === 'INPUT' ? 'oninput' : 'onchange'] = crtaj);

  document.addEventListener('keydown', esc_);
  $('#cpZatvori').onclick = zatvori;
  o.onclick = e => { if (e.target === o) zatvori(); };
  crtaj(); $('#cpTekst').focus();
}

/* Knjiga iz Vulpesa koja nije u katalogu se doda u katalog */
async function uKatalog(r) {
  if (r.izvor !== 'vulpes') return r;

}

/* ------------------------------------------------ EAN-13 barkod (za očitavanje na blagajni u Vulpesu) */
function ean13(kod, visina = 30) {
  kod = String(kod || '').replace(/\D/g, '');
  if (kod.length !== 13) return '';
  const L = ['0001101', '0011001', '0010011', '0111101', '0100011', '0110001', '0101111', '0111011', '0110111', '0001011'];
  const G = L.map(x => [...x].map(b => b === '1' ? '0' : '1').reverse().join(''));
  const R = L.map(x => [...x].map(b => b === '1' ? '0' : '1').join(''));
  const PAR = ['LLLLLL', 'LLGLGG', 'LLGGLG', 'LLGGGL', 'LGLLGG', 'LGGLLG', 'LGGGLL', 'LGLGLG', 'LGLGGL', 'LGGLGL'];
  let b = '101';
  for (let i = 1; i <= 6; i++) b += (PAR[+kod[0]][i - 1] === 'L' ? L : G)[+kod[i]];
  b += '01010';
  for (let i = 7; i <= 12; i++) b += R[+kod[i]];
  b += '101';
  const m = 1.4, crte = [...b].map((x, i) => x === '1' ? `<rect x="${(i + 9) * m}" width="${m}" height="${visina}"/>` : '').join('');
  return `<svg width="${113 * m}" height="${visina + 11}" viewBox="0 0 ${113 * m} ${visina + 11}"><rect width="100%" height="100%" fill="#fff"/>${crte}
    <text x="${56.5 * m}" y="${visina + 10}" font-size="10" text-anchor="middle" font-family="monospace">${kod}</text></svg>`;
}

/* Barkod narudžbe na potvrdi: 29 + godina + broj (6 znamenki) + kontrolna znamenka. Očita se u tražilici narudžbi. */
function kodNarudzbe(n) {
  const k = '29' + String(n.godina).slice(-4) + String(n.broj).padStart(6, '0');
  const z = [...k].reduce((a, c, i) => a + (+c) * (i % 2 ? 3 : 1), 0);
  return k + (10 - z % 10) % 10;
}
function izKodaNarudzbe(q) {
  const m = /^29(\d{4})(\d{6})\d$/.exec(String(q).trim());
  return m && kodNarudzbe({ godina: m[1], broj: +m[2] }) === String(q).trim() ? { godina: +m[1], broj: +m[2] } : null;
}

/* Kupac preuzima knjige: jednim klikom status "preuzeto" i plaćen ostatak (gotovina/kartica) */
function preuzmiNarudzbu(n, iznos) {
  return new Promise(gotovo => {
    const ost = Math.round((iznos - (n.akontacija || 0)) * 100) / 100, o = document.createElement('div');
    o.className = 'modal';
    const plat = n.platitelj ? `<button id="pBez" class="${ost > 0 ? 'glavni' : ''}">Preuzeto – plaća ${esc(n.platitelj)} (bez naplate)</button>` : '';
    o.innerHTML = `<div class="modal-okvir" style="height:auto;width:min(520px,95vw)">
      <h3 style="margin:0 0 6px">Preuzimanje – narudžba br. ${n.broj}</h3>
      <p style="margin:0 0 4px">${esc(n.kupac)}</p>
      <p style="font-size:20px;margin:6px 0 14px">Za platiti: <b>${kn(Math.max(0, ost))}</b></p>
      <div class="traka">${ost > 0 ? `<button class="glavni" id="pGot">💶 Plaćeno gotovinom</button><button class="glavni" id="pKar">💳 Plaćeno karticom</button>` : `<button class="glavni" id="pBez">✓ Preuzeto (sve plaćeno)</button>`}
        ${ost > 0 ? plat : ''}<button id="pOdustani">Odustani</button></div>
      <p class="siv" style="margin:8px 0 0">Narudžba se označi kao preuzeta${ost > 0 ? ', a uplaćeno postane cijeli iznos' : ''}.</p></div>`;
    document.body.appendChild(o);
    const kraj = async (naplati, nacin) => {
      if (naplati !== null) {
        await api('/api/narudzba/preuzeto', { id: n.id, naplati, nacin_pl: nacin });
        poruka(`Narudžba ${n.broj} preuzeta.`);
      }
      o.remove(); document.removeEventListener('keydown', tipke); gotovo(naplati !== null);
    };
    const tipke = e => { if (e.key === 'Escape') kraj(null); };
    document.addEventListener('keydown', tipke);
    if ($('#pGot', o)) { $('#pGot', o).onclick = () => kraj(true, 'Gotovina'); $('#pKar', o).onclick = () => kraj(true, 'Kartica'); $('#pGot', o).focus(); }
    if ($('#pBez', o)) { $('#pBez', o).onclick = () => kraj(false); if (!$('#pGot', o)) $('#pBez', o).focus(); }
    $('#pOdustani', o).onclick = () => kraj(null);
    o.onclick = e => { if (e.target === o) kraj(null); };
  });
}

/* Naljepnice za vrećice s knjigama: A4 arak 3 × 8 (70 × 37 mm). Može se početi od bilo koje naljepnice na arku. */
async function ispisNaljepnica(ids = oznacene()) {
  if (!ids.length) return poruka('Označi narudžbe kvačicom.', true);
  let od;
  try { od = localStorage.getItem('naljepniceOd') || '1'; } catch { od = '1'; }
  const odg = prompt(`Ispis ${ids.length} naljepnic${ids.length === 1 ? 'e' : 'a'} na arak 3 × 8 (70 × 37 mm).\nOd koje naljepnice na arku početi? (1–24; 1 = gore lijevo)`, '1');
  if (odg === null) return;
  od = Math.min(24, Math.max(1, parseInt(odg) || 1));
  const ns = await Promise.all(ids.map(id => api('/api/narudzba?id=' + id)));
  const prazne = Array(od - 1).fill('<div class="naljepnica"></div>');
  const sve = prazne.concat(ns.map(n => {
    const kom = n.stavke.reduce((a, s) => a + s.kolicina, 0);
    return `<div class="naljepnica">
      <div style="display:flex;justify-content:space-between;align-items:baseline"><span class="br">${n.broj}/${n.godina}</span><span>${kom} knj.</span></div>
      <div class="ime">${esc(n.kupac)}</div>
      <div>${esc(n.skola || '')}${n.razred ? ` · ${esc(n.razred)}. r.` : ''}${n.telefon ? ` · ${esc(n.telefon)}` : ''}</div>
      ${ean13(kodNarudzbe(n), 20)}</div>`;
  }));
  let html = '<style>@page { size: A4; margin: 11.5mm 0 0 0; }</style>';
  for (let i = 0; i < sve.length; i += 24) html += `<div class="naljepnice">${sve.slice(i, i + 24).join('')}</div>`;
  $('#ispis').innerHTML = html;
  try { localStorage.setItem('naljepniceOd', String((od - 1 + ns.length) % 24 + 1)); } catch { }
  await ispisi();
}

async function stranicaDanas() {
  const d = await api('/api/danas');
  const dan = new Date().toLocaleDateString('hr-HR', { weekday: 'long', day: 'numeric', month: 'long' });
  const red = n => `<tr class="klik" data-id="${n.id}"><td>${n.broj}/${n.godina}</td><td><b>${esc(n.kupac)}</b></td><td>${esc(n.telefon)}</td>
    <td>${esc(n.skola || '')} ${esc(n.razred)}</td><td class="br">${kn(n.iznos - n.akontacija)}</td>
    <td>${n.ceka == null ? '' : n.ceka === 0 ? 'stiglo danas' : `čeka ${n.ceka} d`}</td>
    <td class="nema-klik">${gumbiObavijesti(n, n.iznos - n.akontacija)} <button class="mali" data-preuzmi="${n.id}" style="background:var(--zelena);color:#fff;border-color:var(--zelena)">✓ Preuzeto</button></td></tr>`;

    <tbody>${l.map(red).join('')}</tbody></table>` : `<p class="siv">${prazno}</p>`;
  const kartica = (broj, tekst, link, boja = '') => `<a class="okvir" href="${link}" ${link.startsWith('#danas-') ? `onclick="event.preventDefault();document.getElementById('${link.slice(1)}').scrollIntoView({behavior:'smooth'})"` : ''} style="display:block;text-decoration:none;color:inherit;min-width:160px;flex:1;${boja}">
    <div style="font-size:28px;font-weight:700">${broj}</div><div>${tekst}</div></a>`;
  const kopijaStara = !d.kopija || (Date.now() - new Date(d.kopija)) / 864e5 > 2;
  const vanjskaLose = d.kopija_mapa && !String(d.kopija_vanjska).startsWith('OK');
  const naruciKom = d.naruciti.reduce((a, r) => a + r.komada, 0);
  $('#sadrzaj').innerHTML = `
    <h2>Danas <span class="siv" style="font-size:16px">${esc(dan)}</span></h2>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px">
      ${kartica(d.danas.narudzbi, `narudžbi danas · ${kn(d.danas.iznos)}`, '#narudzbe')}
      ${kartica(d.predbiljezbe, 'novih predbilježbi s interneta', '#predbiljezbe', d.predbiljezbe ? 'border-color:#dc2626;background:#fef2f2' : '')}
      ${kartica(d.stiglo_novo.length + d.stiglo_ceka.length, 'stiglo – čeka kupca', '#danas-stiglo', d.stiglo_ceka.length ? 'border-color:#f59e0b;background:#fffbeb' : '')}
      ${kartica(naruciKom, `knjiga treba naručiti (${d.naruciti.length} nakladnik${d.naruciti.length === 1 ? '' : 'a'})`, '#nakladnici', naruciKom ? 'border-color:#2563eb;background:#eff6ff' : '')}
      ${kartica(d.naruceno, `naručeno, čeka nakladnika${d.djelomicno ? ` (${d.djelomicno} djelomično stiglo)` : ''}`, '#stiglo')}
    </div>
    <div class="traka"><button class="glavni" onclick="location.hash='#nova'">+ Nova narudžba (F2)</button>
      <button onclick="location.hash='#stiglo'">📦 Stigle su knjige</button>
      <button onclick="location.hash='#nakladnici'">📝 Naruči od nakladnika</button>
      <button onclick="location.hash='#narudzbe'">Sve narudžbe</button></div>
    ${d.baza_greska ? `<div class="okvir" style="border-color:#b91c1c;background:#fee2e2">⚠️ <b>Baza nije ispravna.</b> Idi u <a href="#postavke">Postavke</a> i vrati zadnju ispravnu kopiju.</div>` : ''}
    <div class="okvir" id="danas-stiglo"><b>⏰ Stiglo prije ${d.podsjetnik_dana} i više dana, a kupac nije došao (${d.stiglo_ceka.length})</b>
      ${d.stiglo_ceka.length ? `<button class="mali" id="dPodsjeti" style="margin-left:8px">📲 Podsjeti sve redom</button>` : ''}
      ${tablica(d.stiglo_ceka, 'Nema – svi su na vrijeme došli po knjige.')}</div>
    <div class="okvir"><b>📦 Stiglo nedavno – obavijesti kupca (${d.stiglo_novo.length})</b>
      ${d.stiglo_novo.length ? `<button class="mali" id="dObavijesti" style="margin-left:8px">📲 Obavijesti sve redom</button>
        <button class="mali" id="dNaljepnice">🏷 Naljepnice za vrećice</button>` : ''}
      ${tablica(d.stiglo_novo, 'Nema novih.')}</div>
    ${d.naruciti.length ? `<div class="okvir"><b>📝 Treba naručiti od nakladnika</b>
      <table><tbody>${d.naruciti.map(r => `<tr><td>${esc(r.nakladnik)}</td><td class="br">${r.naslova} naslova</td><td class="br"><b>${r.komada} kom.</b></td></tr>`).join('')}</tbody></table>
      <button class="mali glavni" onclick="location.hash='#nakladnici'">Napravi narudžbenice…</button></div>` : ''}
    <p class="siv">Zadnja automatska kopija baze: ${d.kopija ? datum(d.kopija) : '<b style="color:#b91c1c">još nema</b>'}${kopijaStara && d.kopija ? ' <b style="color:#b91c1c">(stara!)</b>' : ''}
      ${d.kopija_mapa ? ` · dodatna (USB/Drive): ${vanjskaLose ? `<b style="color:#b91c1c">${esc(d.kopija_vanjska || 'još nije napravljena')}</b>` : esc(String(d.kopija_vanjska).slice(3, 21))}` : ''}</p>`;
  const sveStiglo = d.stiglo_novo.concat(d.stiglo_ceka);
  $('#sadrzaj').onclick = async e => {
    const p = e.target.closest('[data-preuzmi]');
    if (p) {
      const n = sveStiglo.find(x => x.id == p.dataset.preuzmi);
      if (await preuzmiNarudzbu(n, n.iznos)) stranicaDanas();
      return;
    }
    if (e.target.closest('.nema-klik, a, button')) return;
    const tr = e.target.closest('tr[data-id]'); if (tr) location.hash = '#narudzba/' + tr.dataset.id;
  };
  if ($('#dObavijesti')) $('#dObavijesti').onclick = () => obavijestiSve(d.stiglo_novo);
  if ($('#dPodsjeti')) $('#dPodsjeti').onclick = () => obavijestiSve(d.stiglo_ceka);
  if ($('#dNaljepnice')) $('#dNaljepnice').onclick = () => ispisNaljepnica(d.stiglo_novo.map(n => n.id));
}

async function stranicaNarudzba(id) {
  const n = id ? await api('/api/narudzba?id=' + id) : { kupac: '', telefon: '', skola_id: '', razred: '', akontacija: 0, nacin_pl: '', napomena: '', status: 'naručeno', stavke: [] };
  $('#sadrzaj').innerHTML = `
    <h2>${id ? `Narudžba br. ${n.broj}/${n.godina} <span class="siv">${datum(n.datum)}</span>` : 'Nova narudžba'}</h2>
    <div class="polja">
      <label>Telefon (mobitel)<input id="telefon" value="${esc(n.telefon)}" placeholder="upiši broj – stari kupci se popune sami"><span id="kupacPrijedlog"></span></label>
      <label>Kupac (ime i prezime)<input id="kupac" value="${esc(n.kupac)}"></label>

    </div>
    <div class="okvir">
      <div class="traka"><b>Dodaj komplet:</b> <select id="komplet" style="min-width:280px"></select>
        <span class="siv" id="kSavjet">Prvo odaberi školu i razred – ponude se samo njihovi kompleti.</span></div>
      <div id="kKnjige"></div>
      <div><b>Dodaj knjigu:</b> <input id="traziKnjigu" placeholder="Naziv, autor ili barkod (čitač) pa Enter…" style="width:100%;margin-top:4px">
        <div class="prijedlozi" id="prijedlozi"></div></div>
    </div>
    <table><thead><tr><th>#</th><th>Naziv</th><th>Nakladnik</th><th class="br">Kol.</th><th class="br">Stiglo</th><th class="br">Cijena</th><th class="br">Iznos</th><th></th></tr></thead><tbody id="stavke"></tbody></table>
    <div class="zbroj"><span>Ukupno: <b id="ukupno"></b></span>
      <label>Uplaćeno (akontacija): <input id="akontacija" value="${n.akontacija || ''}" style="width:90px;text-align:right"> €</label>
      <span>Za platiti: <b id="ostatak"></b></span></div>
    <div class="polja">
      <label>Način plaćanja<select id="nacin_pl">${['', 'Gotovina', 'Kartica', 'Virman'].map(v => `<option ${v === n.nacin_pl ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
      <label>Status<select id="status">${statusOpcije(n.status)}</select></label>
      <label>Plaća<input id="platitelj" list="platitelji" value="${esc(n.platitelj || '')}" placeholder="roditelj (prazno)">
        <datalist id="platitelji">${[...new Set(['Grad', 'CZSS', 'Županija', ...S.platitelji])].map(p => `<option value="${esc(p)}">`).join('')}</datalist></label>
      <label class="sirok">Napomena<textarea id="napomena">${esc(n.napomena)}</textarea></label>
    </div>
    <div class="traka">
      <button class="glavni" onclick="spremiNarudzbu()" title="Prečac: Ctrl+S">Spremi</button>
      <button class="glavni" onclick="spremiNarudzbu(true)" title="Prečac: F9">Spremi i ispiši (F9)</button>
      ${id && ['naručeno', 'stiglo'].includes(n.status) ? '<button class="glavni" id="nPreuzmi" style="background:var(--zelena);border-color:var(--zelena)">✓ Preuzeto i plaćeno</button>' : ''}
      <button onclick="history.back()">Odustani</button>
      ${id ? `<button onclick="ispisNaljepnica([${id}])" title="Naljepnica za vrećicu s knjigama">🏷 Naljepnica</button>` : ''}
      ${id ? `<button onclick="ispisZaSkolu('ponuda', [${id}])" title="Ponuda (npr. za školu ili Grad)">📄 Ponuda</button><button onclick="ispisZaSkolu('otpremnica', [${id}])">🚚 Otpremnica</button>` : ''}
      <span class="siv">F2 = nova narudžba</span>
      ${id ? `<span id="obavijest"></span>` : ''}
      ${id ? '<div class="desno"><button class="opasno" onclick="obrisiNarudzbu()">Obriši narudžbu</button></div>' : ''}
    </div>`;
  S.n = n;
  api('/api/rabljene?status=' + encodeURIComponent('na stanju')).then(r => { S.rabljeneStanje = r; if ($('#stavke')) crtajStavke(); });
  // stari kupac po broju mobitela: ako je jedan, popuni se sam; ako ih je više, ponude se za klik
  let zadnjiTel = '', tTel;
  const primijeniKupca = r => {
    if (!$('#kupac').value.trim()) $('#kupac').value = r.kupac;
    if (r.skola_id && !$('#skola').value) $('#skola').value = r.skola_id;
    // novi razred: ako je kupio prošle godine, sad je razred više
    const raz = +r.razred ? String(+r.razred + (r.godina < S.sezona ? S.sezona - r.godina : 0)) : r.razred;
    if (!$('#razred').value && [...$('#razred').options].some(o => o.value === raz)) $('#razred').value = raz;
    osvjeziKomplete();
  };
  const traziKupca = async () => {
    const tel = $('#telefon').value.replace(/\D/g, '');
    if (id || tel.length < 6 || tel === zadnjiTel || ($('#kupac').value.trim() && $('#skola').value)) return;
    zadnjiTel = tel;
    const l = await api('/api/kupac?telefon=' + encodeURIComponent($('#telefon').value));
    const isti = l.length && l.every(r => r.kupac === l[0].kupac && r.skola_id === l[0].skola_id);
    if (isti) {
      primijeniKupca(l[0]);
      $('#kupacPrijedlog').innerHTML = `<span class="siv">↳ popunjeno prema narudžbi iz ${l[0].godina}.</span>`;
      return;
    }
    $('#kupacPrijedlog').innerHTML = l.map((r, i) => `<a class="mali" href="#" data-i="${i}">↳ ${esc(r.kupac)} · ${esc(r.skola || '')} ${esc(r.razred)}. r. (${r.godina})</a>`).join(' ');
    $('#kupacPrijedlog').onclick = e => {
      const r = l[e.target.dataset.i]; if (!r) return; e.preventDefault();
      primijeniKupca(r); $('#kupacPrijedlog').innerHTML = '';
    };
  };
  $('#telefon').onblur = traziKupca;
  $('#telefon').addEventListener('input', () => { clearTimeout(tTel); if ($('#telefon').value.replace(/\D/g, '').length >= 9) tTel = setTimeout(traziKupca, 400); });
  const osvjeziKomplete = () => {
    const sk = $('#skola').value, raz = $('#razred').value;
    const ks = S.kompleti.filter(k => (!sk || k.skola_id == sk) && (!raz || k.razred == raz));
    $('#komplet').innerHTML = `<option value="">— odaberi komplet / smjer (${ks.length}) —</option>` +

    $('#kKnjige').innerHTML = '';
    $('#kSavjet').textContent = sk && raz ? (ks.length ? (ks.length > 1 ? 'Odaberi smjer.' : '') : 'Za ovu školu i razred nema kompleta.')
      : 'Prvo odaberi školu i razred – ponude se samo njihovi kompleti.';
    if (sk && raz && ks.length === 1 && !S.n.stavke.length) { $('#komplet').value = ks[0].id; prikaziKomplet(ks[0]); }
  };
  // knjige kompleta s kvačicama (kao papirnati obrazac): odznači što kupac ne treba pa "Dodaj označene"
  const prikaziKomplet = k => {
    const knj = k.knjige.map(knjigaPoId).filter(Boolean), ima = id => S.n.stavke.some(s => s.knjiga_id === id);
    $('#kSavjet').textContent = '';
    $('#kKnjige').innerHTML = `<div style="margin-top:8px"><b>${esc(k.naziv)}</b> <span class="siv">– odznači knjige koje kupac ne treba</span>
      <label style="margin-left:10px"><input type="checkbox" id="kSve" checked> sve</label>
      <table style="margin-top:4px"><tbody>${knj.map(b => `<tr><td style="width:24px"><input type="checkbox" class="kKnj" value="${b.id}" ${ima(b.id) ? 'disabled' : 'checked'}></td>
        <td>${esc(b.naziv)}${ima(b.id) ? ' <span class="siv">(već dodano)</span>' : ''}</td><td>${esc(b.vrsta)}</td><td>${esc(b.nakladnik)}</td><td class="br">${kn(b.cijena)}</td></tr>`).join('')}</tbody></table>
      <div class="traka" style="margin-top:6px"><button class="glavni" id="kDodaj">Dodaj označene</button>
        <label title="Za narudžbu škole: upiši broj učenika i svaka knjiga se doda toliko puta">× <input type="number" id="kPuta" value="1" min="1" style="width:70px"> komada</label>
        <button id="kOdustani">Zatvori</button></div></div>`;
    $('#kSve').onchange = e => document.querySelectorAll('.kKnj:not(:disabled)').forEach(c => c.checked = e.target.checked);
    $('#kOdustani').onclick = () => { $('#kKnjige').innerHTML = ''; $('#komplet').value = ''; };
    $('#kDodaj').onclick = () => {
      const puta = Math.max(1, parseInt($('#kPuta').value) || 1);
      document.querySelectorAll('.kKnj:checked:not(:disabled)').forEach(c => dodajStavku(knjigaPoId(+c.value), puta));
      $('#kKnjige').innerHTML = ''; $('#komplet').value = '';
    };
  };
  osvjeziKomplete();
  $('#skola').onchange = async e => { if (e.target.value === '+') await novaSkola(e.target); osvjeziKomplete(); };
  $('#razred').onchange = osvjeziKomplete;
  $('#komplet').onchange = e => {
    const k = S.kompleti.find(k => k.id == e.target.value);
    if (!k) return;
    if (!$('#skola').value && k.skola_id) $('#skola').value = k.skola_id;
    if (!$('#razred').value && k.razred) $('#razred').value = k.razred;
    prikaziKomplet(k);
  };
  $('#akontacija').oninput = crtajStavke;
  if (id) $('#obavijest').innerHTML = 'Obavijesti kupca: ' + gumbiObavijesti(n, n.stavke.reduce((a, s) => a + s.cijena * s.kolicina, 0) - n.akontacija);
  trazilica($('#traziKnjigu'), $('#prijedlozi'), async r => dodajStavku(await uKatalog(r)));
  if ($('#nPreuzmi')) $('#nPreuzmi').onclick = async () => {
    if (S.nespremljeno && !(await spremiNarudzbu(false, true))) return;
    const uk = S.n.stavke.reduce((a, s) => a + s.cijena * s.kolicina, 0);
    if (await preuzmiNarudzbu({ ...n, akontacija: broj($('#akontacija').value), platitelj: $('#platitelj').value }, uk)) location.hash = '#narudzbe';
  };
  crtajStavke();
  $('#sadrzaj').oninput = $('#sadrzaj').onchange = () => { S.nespremljeno = true; };
  (id ? $('#kupac') : $('#telefon')).focus();
}
function dodajStavku(k, puta = 1) {
  const postoji = S.n.stavke.find(s => s.knjiga_id && s.knjiga_id === k.id);
  if (postoji) postoji.kolicina += puta;
  else S.n.stavke.push({ knjiga_id: k.id, naziv: k.naziv, barkod: k.barkod, nakladnik: k.nakladnik, cijena: k.cijena, kolicina: puta });
  S.nespremljeno = true;
  crtajStavke();
}
function crtajStavke() {
  const st = S.n.stavke;
  const rab = s => (S.rabljeneStanje || []).filter(r => (s.barkod && r.barkod === s.barkod) || (s.knjiga_id && r.knjiga_id === s.knjiga_id) || norm(r.naziv) === norm(s.naziv));
  const znackaRab = s => { const r = rab(s); return r.length ? `<span class="znacka" title="Rabljeni primjerci na stanju">♻ ${r.length} rabljen${r.length > 1 ? 'e' : 'a'} (${r.map(x => kn(x.prodajna_cijena)).join(', ')})</span>` : ''; };
  $('#stavke').innerHTML = st.map((s, i) => `<tr><td>${i + 1}</td><td>${esc(s.naziv)}${znackaRab(s)}</td><td>${esc(s.nakladnik)}</td>
    <td class="br"><input type="number" min="1" value="${s.kolicina}" style="width:60px" onchange="S.n.stavke[${i}].kolicina=+this.value||1;crtajStavke()"></td>
    <td class="br"><input type="number" min="0" max="${s.kolicina}" value="${s.stiglo || 0}" style="width:55px;${(s.stiglo || 0) >= s.kolicina ? 'background:#dcfce7' : ''}" onchange="S.n.stavke[${i}].stiglo=Math.min(+this.value||0,S.n.stavke[${i}].kolicina);crtajStavke()"></td>
    <td class="br"><input value="${s.cijena}" style="width:80px;text-align:right" onchange="S.n.stavke[${i}].cijena=broj(this.value);crtajStavke()"></td>
    <td class="br">${kn(s.cijena * s.kolicina)}</td>
    <td><button class="mali opasno" onclick="S.n.stavke.splice(${i},1);crtajStavke()">✕</button></td></tr>`).join('')
    || '<tr><td colspan="8" class="siv">Još nema knjiga. Odaberi komplet ili potraži knjigu.</td></tr>';
  const uk = st.reduce((a, s) => a + s.cijena * s.kolicina, 0);
  $('#ukupno').textContent = kn(uk);
  $('#ostatak').textContent = kn(uk - broj($('#akontacija').value));
}
async function spremiNarudzbu(ispisi, ostani) {
  if (S.spremam || !$('#akontacija')) return;  // dvostruki klik ne smije napraviti dvije narudžbe
  S.spremam = true;
  document.querySelectorAll('#sadrzaj button').forEach(b => b.disabled = true);
  try {
    const sk = $('#skola').value;
    const d = { ...S.n, kupac: $('#kupac').value, telefon: $('#telefon').value, skola_id: sk && sk !== '+' ? +sk : null,
      razred: $('#razred').value, akontacija: broj($('#akontacija').value), nacin_pl: $('#nacin_pl').value,
      status: $('#status').value, napomena: $('#napomena').value, platitelj: $('#platitelj').value };
    const { id, inacica } = await api('/api/narudzba', d);
    S.n.id = id; S.n.inacica = inacica; S.nespremljeno = false;
    poruka('Narudžba spremljena.');
    ({ godine: S.godine, platitelji: S.platitelji } = await api('/api/init'));
    if (ispisi) await ispisListica([id]);
    if (ostani) return id;
    if (ispisi && !d.id) {  // nova narudžba ispisana -> odmah prazna za sljedećeg kupca
      poruka('Narudžba spremljena – upiši sljedećeg kupca.');
      if (location.hash === '#nova') ruta(); else location.hash = '#nova';
    } else location.hash = '#narudzbe';
    return id;
  } catch (e) {
    return null;
  } finally {
    S.spremam = false;
    document.querySelectorAll('#sadrzaj button').forEach(b => b.disabled = false);
  }
}
async function obrisiNarudzbu() {
  if (!confirm('Sigurno obrisati ovu narudžbu?')) return;
  await api('/api/narudzba/obrisi', { id: S.n.id });
  S.nespremljeno = false;
  poruka('Narudžba obrisana.');
  location.hash = '#narudzbe';
}

/* ------------------------------------------------ Zbirni popis (za naručivanje od nakladnika) */
async function stranicaZbirno() {
  const f = S.zf || (S.zf = { godina: S.sezona || '', status: 'naručeno', skola: '' });
  const q = new URLSearchParams(f);
  const z = await api('/api/zbirno?' + q);
  const nakladnici = [...new Set(z.map(r => r.nakladnik))];
  const tablica = () => nakladnici.map(nak => {
    const r = z.filter(x => x.nakladnik === nak);
    return `<tr><th colspan="5">${esc(nak || 'bez nakladnika')} <span class="siv">(${r.reduce((a, x) => a + x.kolicina, 0)} kom)</span></th></tr>` +
      r.map(x => `<tr><td>${esc(x.naziv)}</td><td>${esc(x.barkod)}</td><td class="br"><b>${x.kolicina}</b></td><td class="br">${kn(x.cijena)}</td><td class="br siv">${x.narudzbi} nar.</td></tr>`).join('');
  }).join('');
  $('#sadrzaj').innerHTML = `
    <h2>Zbirni popis knjiga</h2>
    <p class="siv">Koliko kojih knjiga treba, po nakladniku. Za naručivanje od nakladnika ili pripremu za školu.</p>
    <div class="traka">
      <select id="zGod">${godinaOpcije(f.godina)}</select>
      <select id="zStatus">${statusOpcije(f.status, 'svi statusi')}</select>
      <select id="zSkola">${skolaOpcije(f.skola, 'sve škole')}</select>
      <div class="desno"><button onclick="location.href=sRazinom('/csv/zbirno?${q}')">Excel (CSV)</button><button onclick="ispisi()">Ispiši</button></div>
    </div>
    <table><thead><tr><th>Naziv</th><th>Barkod</th><th class="br">Količina</th><th class="br">Cijena</th><th></th></tr></thead><tbody>${tablica()}</tbody></table>`;
  $('#ispis').innerHTML = zaglavljeIspisa(`Datum: ${datum(new Date().toLocaleDateString('sv-SE'))}`) + `<h3>Zbirni popis · ${esc(f.status || 'svi statusi')} · ${esc(f.godina || '')}</h3><table>${tablica()}</table>`;
  for (const [id, k] of [['zGod', 'godina'], ['zStatus', 'status'], ['zSkola', 'skola']])
    $('#' + id).onchange = e => { f[k] = e.target.value; stranicaZbirno(); };
}

/* ------------------------------------------------ Učitavanje popisa škole (PDF / Word / Excel) */
async function datotekaBase64(f) {
  const b = new Uint8Array(await f.arrayBuffer());
  let bin = ''; for (let i = 0; i < b.length; i += 8192) bin += String.fromCharCode(...b.subarray(i, i + 8192));
  return btoa(bin);
}

          ${i ? `<button class="mali" data-spoji="${si}:${i}" title="Spoji s redom iznad (ako je naslov prelomljen)">⤒</button>` : ''}</td></tr>`;
      }).join('')}</tbody></table></div>`).join('')}
    <div class="traka"><button class="glavni" id="pSpremi">Spremi komplete</button><button onclick="location.hash='#kompleti'">Odustani</button></div>`;
  const r = $('#pRezultat');
  r.querySelectorAll('.pSekUk').forEach(c => c.onchange = () => S.popis[c.dataset.sek].ukljuci = c.checked);
  r.querySelectorAll('.pSmjer').forEach(c => c.oninput = () => S.popis[c.dataset.sek].smjer = c.value);
  r.querySelectorAll('.pRazred').forEach(c => c.oninput = () => S.popis[c.dataset.sek].razred = c.value);
  r.querySelectorAll('.pUk').forEach(c => c.onchange = () => S.popis[c.dataset.sek].stavke[c.dataset.i].ukljuci = c.checked);
  r.querySelectorAll('.pIzbor').forEach(c => c.onchange = () => {
    const st = S.popis[c.dataset.sek].stavke[c.dataset.i];
    const opcije = [...st.prijedlozi, ...(st.izbor.trazeno ? [st.izbor] : []), { tip: 'n', naziv: st.naslov }];
    st.izbor = opcije[+c.value]; crtajPopis(vulpes);
  });
  r.querySelectorAll('[data-spoji]').forEach(b => b.onclick = async () => {
    const [si, i] = b.dataset.spoji.split(':').map(Number), sek = S.popis[si];
    const pret = sek.stavke[i - 1], ova = sek.stavke[i];
    for (const k of ['naslov', 'autori', 'nakladnik']) pret[k] = (pret[k] + ' ' + ova[k]).trim();
    pret.sifra = pret.sifra || ova.sifra;
    pret.prijedlozi = await api('/api/popis/predlozi', pret);
    const p = pret.prijedlozi[0];
    pret.izbor = p && p.ocjena >= 0.6 ? p : { tip: 'n', naziv: pret.naslov };
    sek.stavke.splice(i, 1); crtajPopis(vulpes);
  });
  r.querySelectorAll('[data-trazi]').forEach(b => b.onclick = () => {
    const [si, i] = b.dataset.trazi.split(':').map(Number), st = S.popis[si].stavke[i];
    const okvir = b.closest('tr').querySelector('.pTrazi'); okvir.style.display = '';
    const inp = okvir.querySelector('input'); inp.value = st.naslov.split(/[:(,]| - /)[0].split(/\s+/).slice(0, 3).join(' '); inp.focus();
    trazilica(inp, okvir.querySelector('.prijedlozi'), k => {
      st.izbor = k.izvor === 'vulpes' ? { tip: 'v', sifra: k.sifra, barkod: k.barkod, naziv: k.naziv, cijena: k.cijena, trazeno: true }
        : { tip: 'k', id: k.id, naziv: k.naziv, cijena: k.cijena, trazeno: true };
      st.ukljuci = true; crtajPopis(vulpes);
    });
    inp.dispatchEvent(new Event('input'));
  });
  $('#pSpremi').onclick = async () => {
    const sk = $('#pSkola').value;
    if (!sk || sk === '+') return poruka('Odaberi školu na vrhu.', true);
    const sekcije = S.popis.filter(s => s.ukljuci).map(s => ({ smjer: s.smjer, razred: s.razred,
      stavke: s.stavke.filter(x => x.ukljuci).map(x => ({ izbor: x.izbor, sifra: x.sifra, naslov: x.naslov, autori: x.autori, nakladnik: x.nakladnik, predmet: x.predmet })) }));
    const rez = await api('/api/popis/spremi', { skola_id: +sk, sekcije });
    await ucitajOsnovno();
    poruka(`Spremljeno ${rez.kompleta} kompleta (${rez.novih_knjiga} novih knjiga).`);
    S.kf = sk; location.hash = '#kompleti';
  };
}

/* ------------------------------------------------ Obavijest kupcu (WhatsApp / SMS) */
function brojMobitela(t) {
  let d = String(t || '').replace(/\D/g, '');
  if (d.startsWith('00')) d = d.slice(2);
  else if (d.startsWith('0')) d = '385' + d.slice(1);
  return d.length >= 9 ? d : '';
}
const cekaDana = n => n.status === 'stiglo' && n.stiglo_datum ? Math.floor((Date.now() - new Date(n.stiglo_datum)) / 864e5) : -1;
function porukaKupcu(n, ostatak) {
  const podsjetnik = cekaDana(n) >= +S.postavke.podsjetnik_dana && S.postavke.poruka_podsjetnik;
  return ((podsjetnik ? S.postavke.poruka_podsjetnik : S.postavke.poruka_kupcu) || '').replace(/\{broj\}/g, n.broj).replace(/\{kupac\}/g, n.kupac)
    .replace(/\{firma\}/g, S.postavke.firma).replace(/\{ostatak\}/g, kn(Math.max(0, ostatak)));
}
function gumbiObavijesti(n, ostatak) {
  const tel = brojMobitela(n.telefon);
  if (!tel) return '';
  const p = encodeURIComponent(porukaKupcu(n, ostatak));
  return `<a class="mali" title="WhatsApp" target="_blank" href="https://wa.me/${tel}?text=${p}">💬 WhatsApp</a>
    <a class="mali" title="SMS" href="sms:+${tel}?body=${p}">✉ SMS</a>`;
}

/* ------------------------------------------------ Obavijesti više kupaca redom */
function obavijestiSve(ns) {
  ns = (ns || []).filter(n => brojMobitela(n.telefon));
  if (!ns.length) return poruka('Označi narudžbe kvačicom (kupci s brojem mobitela).', true);
  const poslano = new Set(), o = document.createElement('div');
  o.className = 'modal';
  const sljedeci = () => ns.find(n => !poslano.has(n.id));
  const link = (n, nacin) => {
    const tel = brojMobitela(n.telefon), t = encodeURIComponent(porukaKupcu(n, n.iznos - n.akontacija));
    return nacin === 'wa' ? `https://wa.me/${tel}?text=${t}` : `sms:+${tel}?body=${t}`;
  };
  const crtaj = () => {
    const s = sljedeci();
    o.innerHTML = `<div class="modal-okvir" style="height:auto;max-height:85vh"><div class="traka"><b>Obavijesti kupce</b>
        <span class="siv">${poslano.size} / ${ns.length} poslano</span>
        <div class="desno">${s ? `<button class="glavni" id="oSljedeci">💬 WhatsApp: ${esc(s.kupac)} ▶</button>` : '<b style="color:#166534">✓ Svi su obaviješteni</b>'}
          <button id="oZatvori">Zatvori</button></div></div>
      <p class="siv" style="margin:4px 0">Klikni "WhatsApp" – otvori se poruka, pošalješ je, vratiš se ovdje i klikneš za sljedećeg.</p>
      <div style="overflow:auto"><table><tbody>${ns.map(n => `<tr style="${poslano.has(n.id) ? 'background:#dcfce7' : ''}">
        <td>${n.broj}</td><td>${esc(n.kupac)}</td><td>${esc(n.telefon)}</td><td class="br">${kn(n.iznos - n.akontacija)}</td>
        <td><a class="mali" target="_blank" data-id="${n.id}" href="${link(n, 'wa')}">💬 WhatsApp</a> <a class="mali" data-id="${n.id}" href="${link(n, 'sms')}">✉ SMS</a>
          ${poslano.has(n.id) ? ' ✓' : ''}</td></tr>`).join('')}</tbody></table></div></div>`;
    o.querySelectorAll('a[data-id]').forEach(a => a.addEventListener('click', () => { poslano.add(+a.dataset.id); setTimeout(crtaj, 300); }));
    if ($('#oSljedeci', o)) $('#oSljedeci', o).onclick = () => { const n = sljedeci(); window.open(link(n, 'wa'), '_blank'); poslano.add(n.id); crtaj(); };
    $('#oZatvori', o).onclick = () => o.remove();
  };
  document.body.appendChild(o); crtaj();
}

/* ------------------------------------------------ Zbirni popis za platitelja (Grad, Županija, CZSS) */

  const ns = await api('/api/platitelj?' + q), p = S.postavke;

    <p>Školska godina ${f.godina ? `${f.godina}./${+f.godina + 1}.` : ''}${sk ? ' · ' + esc(sk.naziv) : ''}${S.razina ? ' · ' + (S.razina === 'OŠ' ? 'osnovne škole' : 'srednje škole') : ''} · ${ns.length} učenika</p>
    <table><thead><tr><th>#</th><th>Br. nar.</th><th>Učenik / kupac</th><th>Škola</th><th>Raz.</th><th>Knjige</th><th class="br">Iznos</th></tr></thead><tbody>
    ${ns.map((n, i) => `<tr><td>${i + 1}</td><td>${n.broj}</td><td>${esc(n.kupac)}</td><td>${esc(n.skola || '')}</td><td>${esc(n.razred)}</td>
      <td style="font-size:11px">${n.stavke.map(s => esc(s.naziv) + (s.kolicina > 1 ? ' ×' + s.kolicina : '')).join('; ')}</td><td class="br">${kn(n.iznos)}</td></tr>`).join('')}
    </tbody></table><p style="text-align:right;font-size:15px">Ukupno: <b>${kn(uk)}</b></p>
    <p style="margin-top:30px">Potpis i pečat: ______________________</p>`;
  if (confirm('Ispisati popis? (Odustani = preuzmi Excel/CSV)')) await ispisi();
  else location.href = sRazinom('/csv/platitelj?' + q);

/* ------------------------------------------------ Stiglo (primka po knjigama) */

    $('#pStavke').innerHTML = S.primka.map((s, i) => `<tr><td>${esc(s.naziv)}</td><td>${esc(s.barkod)}</td>

      || '<tr><td colspan="4" class="siv">Još ništa nije očitano.</td></tr>';

  };

    const kljuc = r.barkod || r.naziv, post = S.primka.find(s => (s.barkod || s.naziv) === kljuc);
    if (post) post.kolicina++;
    else S.primka.push({ naziv: r.naziv, barkod: r.barkod || '', knjiga_id: r.izvor === 'vulpes' ? null : r.id, kolicina: 1 });
    crtaj();

  $('#pTrazi').focus();
  $('#pOtp').onclick = () => $('#pOtpDat').click();
  $('#pOtpDat').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) ucitajOtpremnicu(f); };
  $('#pOcisti').onclick = () => { S.primka = []; stranicaStiglo(); };
  $('#pRasporedi').onclick = async () => {
    if (!S.primka.length) return poruka('Očitaj barem jednu knjigu.', true);
    const r = await api('/api/primka', { stavke: S.primka.filter(s => s.kolicina > 0) });
    S.primka = []; crtaj();
    const visak = r.stavke.filter(s => s.visak);
    $('#pRez').innerHTML = `
      <div class="okvir"><b>Raspoređeno:</b> ${r.stavke.reduce((a, s) => a + s.raspodijeljeno, 0)} kom.
        ${visak.length ? `<br><span class="siv">Nije bilo narudžbe za: ${visak.map(s => `${esc(s.naziv)} (${s.visak})`).join(', ')} – to ide na policu.</span>` : ''}</div>
      <h3>Kompletne narudžbe (${r.kompletne.length})</h3>
      ${r.kompletne.length ? '<p class="siv">Ove narudžbe su odmah označene kao "stiglo". Obavijesti kupce:</p>' : ''}
      ${r.kompletne.length ? `<table><thead><tr><th><input type="checkbox" id="sve" checked></th><th>Br.</th><th>Kupac</th><th>Telefon</th><th class="br">Za platiti</th><th>Obavijesti</th></tr></thead><tbody>
        ${r.kompletne.map(n => `<tr><td><input type="checkbox" class="oznaka" value="${n.id}" checked></td><td>${n.broj}</td><td>${esc(n.kupac)}</td><td>${esc(n.telefon)}</td>

  };
  crtaj();
}

async function ispisNarudzbenica(ids) {

async function stranicaNarudzbenica(param) {

        <input type="file" id="nExcelDat" accept=".xlsx" style="display:none">`}
      ${povrat ? '' : '<button class="glavni" id="nStiglo" title="Upiše sve knjige s ove narudžbenice u Stiglo; ispraviš samo ono što fali">📦 Stiglo je sve s ove narudžbenice</button>'}
      <button onclick="location.href='/csv/narudzbenica?id=${n.id}'">Excel (CSV)</button><button onclick="location.hash='#nakladnici'">Natrag</button>
      <div class="desno"><button class="opasno" id="nObrisi">Obriši</button></div></div>
    ${povrat ? '' : `<p class="siv">Excel obrazac nakladnika: ${n.obrazac ? `<b>${esc(n.obrazac.ime)}</b> (učitan ${datum(n.obrazac.datum)})` : 'još nije učitan – kod prvog klika odaberite datoteku koju je poslao nakladnik'}
      · <a href="#" id="nExcelNovi">učitaj novi obrazac</a></p>`}
    ${n.poslano ? `<p class="siv">✉ Poslano: ${esc(n.poslano)}</p>` : ''}<div id="nExcelInfo"></div>`;
  $('#nPosalji').onclick = async () => {
    const email = $('#nEmail').value.trim();
    if (!email) return poruka('Upiši e-mail nakladnika.', true);
    if (email !== n.email) await api('/api/nakladnik', { naziv: n.nakladnik, email });
    if (n.poslano && !confirm('Ova narudžbenica je već poslana (' + n.poslano + '). Poslati ponovno?')) return;
    posaljiNarudzbenice([n.id]);
  };
  $('#ispis').innerHTML = dokument;
  if ($('#nStiglo')) $('#nStiglo').onclick = () => {
    if (!S.primka) { try { S.primka = JSON.parse(localStorage.getItem('primka') || '[]'); } catch { S.primka = []; } }
    for (const s of n.stavke) {
      const k = s.barkod && S.knjige.find(x => x.barkod === s.barkod), kljuc = s.barkod || s.naziv;
      const post = S.primka.find(p => (p.barkod || p.naziv) === kljuc);
      if (post) post.kolicina += s.kolicina;
      else S.primka.push({ naziv: s.naziv, barkod: s.barkod || '', knjiga_id: k ? k.id : null, kolicina: s.kolicina });
    }
    spremiPrimku(); location.hash = '#stiglo';
    poruka('Upisano ' + n.stavke.reduce((a, s) => a + s.kolicina, 0) + ' knjiga. Ispravi što fali pa "Rasporedi na narudžbe".');
  };
  $('#nMail').onclick = async () => {
    const email = $('#nEmail').value.trim();
    if (email !== n.email) await api('/api/nakladnik', { naziv: n.nakladnik, email });
    const tijelo = (povrat ? `Poštovani,\n\nprema povratnici br. ${n.broj}/${n.godina} vraćamo Vam sljedeće neprodane udžbenike:\n\n`
      : `Poštovani,\n\nmolimo da nam prema narudžbenici br. ${n.broj}/${n.godina} isporučite:\n\n`) +
      n.stavke.map(s => `${s.kolicina} kom - ${s.naziv}${s.barkod ? ' (' + s.barkod + ')' : ''}`).join('\n') +
      `\n\nUkupno: ${kom} kom.${n.napomena ? '\n' + n.napomena : ''}\n\nLijep pozdrav,\n${p.firma}\n${p.adresa}\ntel. ${p.telefon}`;
    location.href = `mailto:${encodeURIComponent(email)}?subject=${encodeURIComponent(`${povrat ? 'Povratnica' : 'Narudžbenica'} ${n.broj}/${n.godina} - ${p.firma}`)}&body=${encodeURIComponent(tijelo)}`;

      let r;

      const bajt = Uint8Array.from(atob(r.sadrzaj), ch => ch.charCodeAt(0));

      a.href = URL.createObjectURL(new Blob([bajt], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));

        Datoteka je u mapi Preuzimanja; priložite je u e-mail nakladniku.
        ${r.nema.length ? `<div style="color:#991b1b;margin-top:4px">Nisu u obrascu (dopišite ručno ili provjerite barkod): ${r.nema.map(s => `${esc(s.naziv)} ${s.barkod ? '(' + esc(s.barkod) + ')' : '(nema barkod)'} – ${s.kolicina} kom`).join('; ')}</div>` : ''}</div>`;
    };
    $('#nExcel').onclick = () => n.obrazac ? preuzmi() : $('#nExcelDat').click();
    $('#nExcelDat').onchange = e => { const f = e.target.files[0]; e.target.value = ''; f && preuzmi(f); };
    $('#nExcelNovi').onclick = e => { e.preventDefault(); $('#nExcelDat').click(); };
  }
  $('#nObrisi').onclick = async () => {
    if (!confirm('Obrisati narudžbenicu? Te količine će se ponovno predlagati za naručivanje.')) return;
    await api('/api/narudzbenica/obrisi', { id: n.id }); location.hash = '#nakladnici';
  };
}

    <div class="okvir" style="margin-top:12px"><b>Dodaj knjigu:</b><input id="nTrazi" placeholder="Naziv ili barkod…" style="width:100%;margin-top:4px"><div class="prijedlozi" id="nPrijedlozi"></div></div>

async function stranicaRabljene() {
  S.rf = S.rf ?? 'na stanju';
  const lista = await api('/api/rabljene?status=' + encodeURIComponent(S.rf));
  const p = S.postavke, nova = { naziv: '', barkod: '', knjiga_id: null, ocuvanost: 'dobra', otkup_cijena: 0, prodajna_cijena: 0, prodavatelj: '', telefon: '' };
  $('#sadrzaj').innerHTML = `
    <h2>Rabljene knjige</h2>
    <div class="okvir"><b>Otkup rabljene knjige</b>
      <input id="rTrazi" placeholder="Očitaj barkod ili upiši naziv pa Enter…" style="width:100%;margin:4px 0"><div class="prijedlozi" id="rPrijedlozi"></div>
      <div class="polja">
        <label class="sirok">Naziv<input id="rNaziv"></label>
        <label>Očuvanost<select id="rOcuv"><option>kao nova</option><option selected>dobra</option><option>oštećena</option></select></label>
        <label>Otkupna cijena (€)<input id="rOtkup"></label>
        <label>Prodajna cijena (€)<input id="rProdaja"></label>
        <label>Prodavatelj<input id="rProdavatelj"></label>
        <label>Telefon<input id="rTel"></label>
      </div>
      <button class="glavni" id="rSpremi">Spremi otkup</button> <span class="siv">Cijene se predlože kao ${esc(p.rabljene_otkup_posto)}% i ${esc(p.rabljene_prodaja_posto)}% nove cijene (Postavke).</span></div>
    <div class="traka"><select id="rFilter">${['na stanju', 'prodano', ''].map(v => `<option value="${v}" ${v === S.rf ? 'selected' : ''}>${v || 'sve'}</option>`).join('')}</select>
      <input id="rPretraga" placeholder="Traži…"><span class="siv" id="rInfo"></span></div>
    <table><thead><tr><th>Naziv</th><th>Očuvanost</th><th class="br">Otkup</th><th class="br">Prodaja</th><th>Otkupljeno</th><th>Prodavatelj</th><th>Status</th><th></th></tr></thead><tbody id="rRedovi"></tbody></table>`;
  trazilica($('#rTrazi'), $('#rPrijedlozi'), r => {
    Object.assign(nova, { naziv: r.naziv, barkod: r.barkod || '', knjiga_id: r.izvor === 'vulpes' ? null : r.id });
    $('#rNaziv').value = r.naziv;
    $('#rOtkup').value = (r.cijena * broj(p.rabljene_otkup_posto) / 100).toFixed(2);
    $('#rProdaja').value = (r.cijena * broj(p.rabljene_prodaja_posto) / 100).toFixed(2);
  });
  $('#rSpremi').onclick = async () => {
    await api('/api/rabljena', { ...nova, naziv: $('#rNaziv').value, ocuvanost: $('#rOcuv').value, otkup_cijena: broj($('#rOtkup').value),
      prodajna_cijena: broj($('#rProdaja').value), prodavatelj: $('#rProdavatelj').value, telefon: $('#rTel').value });
    poruka('Otkup spremljen.'); stranicaRabljene();
  };
  const crtaj = () => {
    const rijeci = norm($('#rPretraga').value).split(/\s+/).filter(Boolean);
    const l = lista.filter(r => rijeci.every(w => norm(r.naziv + ' ' + r.barkod + ' ' + r.prodavatelj).includes(w)));
    $('#rInfo').textContent = `${l.length} knjiga`;
    $('#rRedovi').innerHTML = l.map(r => `<tr><td>${esc(r.naziv)}<br><span class="siv">${esc(r.barkod)}</span></td><td>${esc(r.ocuvanost)}</td>
      <td class="br">${kn(r.otkup_cijena)}</td><td class="br">${kn(r.prodajna_cijena)}</td><td>${datum(r.datum_otkupa)}</td><td>${esc(r.prodavatelj)}</td>
      <td><span class="status ${r.status === 'prodano' ? 'preuzeto' : ''}">${r.status}</span>${r.datum_prodaje ? ' ' + datum(r.datum_prodaje) : ''}</td>
      <td style="white-space:nowrap">${r.status !== 'prodano' ? `<button class="mali glavni" data-prodaj="${r.id}">Prodano</button>` : ''}
        <button class="mali opasno" data-obrisi="${r.id}">✕</button></td></tr>`).join('') || '<tr><td colspan="8" class="siv">Nema knjiga.</td></tr>';
  };
  $('#rPretraga').oninput = crtaj;
  $('#rFilter').onchange = e => { S.rf = e.target.value; stranicaRabljene(); };
  $('#rRedovi').onclick = async e => {
    const id = +(e.target.dataset.prodaj || e.target.dataset.obrisi);
    if (!id) return;
    const r = lista.find(x => x.id === id);
    if (e.target.dataset.prodaj) await api('/api/rabljena', { ...r, status: 'prodano' });
    else if (confirm('Obrisati?')) await api('/api/rabljena/obrisi', { id }); else return;
    stranicaRabljene();
  };
  crtaj();
}

        <h3>Po nakladniku</h3>${tablica(['Nakladnik', 'Kom', 'Iznos'], s.po_nakladniku.map(r => `<tr><td>${esc(r.nakladnik)}</td><td class="br">${r.komada}</td><td class="br">${kn(r.iznos)}</td></tr>`).join(''))}</div>

/* ------------------------------------------------ Čitanje datoteka u pregledniku: skenirani PDF i slike (prepoznavanje slova) */
const CDN = 'https://cdn.jsdelivr.net/npm/';
const skripte = {};
function ucitajSkriptu(url) {
  return skripte[url] || (skripte[url] = new Promise((ok, ne) => {
    const s = document.createElement('script'); s.src = url; s.onload = ok;
    s.onerror = () => { delete skripte[url]; ne(new Error('Ne mogu učitati dodatak s interneta (' + url.split('/')[4] + '). Provjerite internet.')); };
    document.head.appendChild(s);
  }));
}
async function apiTiho(put, podaci) {  // kao api(), ali greška ne iskače – pozivatelj je obradi sam
  const r = await fetch(put, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(podaci) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.greska || 'Greška');
  return j;
}
const jeSlika = f => /\.(jpe?g|png|bmp|gif|webp|tiff?)$/i.test(f.name) || (f.type || '').startsWith('image/');
/* Stranice PDF-a ili slika -> platna (canvas), širine oko 'sirina' piksela */
async function stranicePlatna(f, sirina = 2000, status = () => {}) {
  if (jeSlika(f)) {
    const slika = await createImageBitmap(f);
    const k = slika.width < 1600 ? 2000 / slika.width : Math.min(1, 2600 / slika.width), c = document.createElement('canvas');
    c.width = Math.round(slika.width * k); c.height = Math.round(slika.height * k);
    c.getContext('2d').drawImage(slika, 0, 0, c.width, c.height);
    return [c];
  }
  status('Učitavam čitač PDF-a…');
  await ucitajSkriptu(CDN + 'pdfjs-dist@3.11.174/build/pdf.min.js');
  pdfjsLib.GlobalWorkerOptions.workerSrc = CDN + 'pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(await f.arrayBuffer()) }).promise, out = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    status(`Otvaram stranicu ${i} od ${pdf.numPages}…`);
    const str = await pdf.getPage(i), v0 = str.getViewport({ scale: 1 });
    const vp = str.getViewport({ scale: sirina / v0.width }), c = document.createElement('canvas');
    c.width = Math.round(vp.width); c.height = Math.round(vp.height);
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    await str.render({ canvasContext: ctx, viewport: vp }).promise;
    out.push(c);
  }
  return out;
}
/* Prepoznavanje slova (hrvatski) – vraća redove s ćelijama (riječi s većim razmakom = nova ćelija) */
async function ocrRedovi(f, status = () => {}) {
  const platna = await stranicePlatna(f, 2200, status);
  status('Učitavam prepoznavanje slova (prvi put traje malo dulje)…');
  await ucitajSkriptu(CDN + 'tesseract.js@5.1.1/dist/tesseract.min.js');
  const worker = await Tesseract.createWorker('hrv', 1, { logger: m => m.status === 'recognizing text' && status(`Čitam slova… ${Math.round(m.progress * 100)}%`) });
  const redovi = [], dijelovi = [];
  try {
    for (let i = 0; i < platna.length; i++) {
      status(`Čitam stranicu ${i + 1} od ${platna.length}…`);
      const { data } = await worker.recognize(platna[i]);
      const k = 595 / platna[i].width, H = platna[i].height, str = [];  // položaji u točkama (kao PDF), y prema gore
      for (const l of data.lines || []) {
        const rijeci = (l.words || []).filter(w => w.text.trim() && w.confidence > 20).sort((a, b) => a.bbox.x0 - b.bbox.x0);
        if (!rijeci.length) continue;
        const znak = rijeci.reduce((a, w) => a + (w.bbox.x1 - w.bbox.x0), 0) / Math.max(1, rijeci.reduce((a, w) => a + w.text.length, 0));
        const celije = [[rijeci[0]]];
        for (let j = 1; j < rijeci.length; j++) {
          if (rijeci[j].bbox.x0 - rijeci[j - 1].bbox.x1 > znak * 2.2) celije.push([]);
          celije[celije.length - 1].push(rijeci[j]);
        }
        redovi.push(celije.map(c => c.map(w => w.text).join(' ')));
        for (const c of celije) {
          const x0 = Math.min(...c.map(w => w.bbox.x0)), x1 = Math.max(...c.map(w => w.bbox.x1));
          const y0 = Math.min(...c.map(w => w.bbox.y0)), y1 = Math.max(...c.map(w => w.bbox.y1));
          str.push([x0 * k, (H - (y0 + y1) / 2) * k, c.map(w => w.text).join(' '), (y1 - y0) * k, (x1 - x0) * k]);
        }
      }
      dijelovi.push(str);
    }
  } finally { await worker.terminate(); }
  if (!redovi.length) throw new Error('Na slici nisam prepoznao tekst.');
  return { redovi, dijelovi };
}
/* Pošalji datoteku na analizu; ako je sken/slika, prvo je pročitaj prepoznavanjem slova pa pošalji redove */
async function analizirajDatoteku(put, f, status = () => {}, dodatno = {}) {
  if (!jeSlika(f)) {
    try { return await apiTiho(put, { ime: f.name, sadrzaj: await datotekaBase64(f), ...dodatno }); }
    catch (e) { if (!e.message.startsWith('SKENIRANO')) throw e; }
  }
  const { redovi, dijelovi } = await ocrRedovi(f, status);
  const r = await apiTiho(put, { ime: f.name, redovi, dijelovi, ...dodatno });
  r.ocr = true;
  return r;
}

    let stavke = [], vulpes = true, ocr = false;
    for (const f of dat) {
      try {
        st('Čitam ' + f.name + '…');
        const r = await analizirajDatoteku('/api/skola-narudzba/analiziraj', f, st);
        vulpes = vulpes && r.vulpes; ocr = ocr || r.ocr;
        stavke.push(...r.stavke.map(x => ({ ...x, datoteka: f.name })));
      } catch (e) { $('#snRezultat').innerHTML = `<p style="color:#991b1b">${esc(f.name)}: ${esc(e.message)}</p>`; return; }
    }
    S.sn = { vulpes, ocr, datoteke: dat.map(f => f.name).join(', '), stavke: stavke.map(st => {

      return { ...st, ukljuci: true, izbor: p && p.ocjena >= 0.6 ? p : { tip: 'n', naziv: st.naslov } };
    }) };
    crtajSkolaNarudzbu();
  };
}
function crtajSkolaNarudzbu() {

  if (!sn.stavke.length) { $('#snRezultat').innerHTML = '<p>U datoteci nisam prepoznao nijednu knjigu s količinom. Pošalji je Claudeu da pogleda.</p>'; return; }

  $('#snSpremi').onclick = async () => {

        <div class="traka" style="margin-top:12px"><button class="glavni" id="snPonuda">📄 Ispiši ponudu za školu</button><button id="snOtpremnica">🚚 Ispiši otpremnicu</button>

async function ispisZaSkolu(tip, ids) {
  if (!ids.length) return poruka('Označi narudžbe kvačicom.', true);
  const ns = (await Promise.all(ids.map(id => api('/api/narudzba?id=' + id)))).sort((a, b) => (a.razred || '').localeCompare(b.razred || '', 'hr', { numeric: true }) || a.broj - b.broj);
  const p = S.postavke, sk = S.skole.find(s => s.id == ns[0].skola_id) || { naziv: ns[0].skola || ns[0].kupac };
  const naslov = tip === 'ponuda' ? 'PONUDA' : 'OTPREMNICA', danas = new Date().toLocaleDateString('hr-HR');
  const brojevi = ns.map(n => n.broj).join(', ') + '/' + ns[0].godina;
  let rb = 0, ukKom = 0, ukIznos = 0;

    const kom = n.stavke.reduce((a, s) => a + s.kolicina, 0), iznos = n.stavke.reduce((a, s) => a + s.kolicina * s.cijena, 0);

      (vise ? `<tr><td colspan="4" class="siv" style="text-align:right">ukupno ${n.razred ? esc(n.razred) + '. razred' : ''}</td><td class="br">${kom}</td><td></td><td class="br">${kn(iznos)}</td></tr>` : '');
  }).join('');

      <div style="border:1px solid #000;padding:6px 10px;min-width:260px"><span class="siv">Kupac:</span><br><b>${esc(sk.naziv)}</b>
        ${sk.adresa ? '<br>' + esc(sk.adresa) : ''}${sk.oib ? '<br>OIB: ' + esc(sk.oib) : ''}</div></div>
    ${tip === 'ponuda' ? '<p>Na temelju Vašeg upita nudimo Vam sljedeće udžbenike:</p>' : '<p>Isporučujemo Vam sljedeće udžbenike:</p>'}
    <table><thead><tr><th>Rb.</th><th>Naziv</th><th>Nakladnik</th><th>Barkod</th><th class="br">Kol.</th><th class="br">Cijena</th><th class="br">Iznos</th></tr></thead>
      <tbody>${dijelovi}</tbody></table>
    <div class="zbroj" style="font-size:15px"><span>Ukupno komada: <b>${ukKom}</b></span><span>UKUPNO: <b>${kn(ukIznos)}</b></span></div>
    ${tip === 'ponuda' ? `<p>${esc(p.ponuda_napomena || '')}</p>` : '<p>Cijene su s uključenim PDV-om.</p>'}
    <div style="display:flex;justify-content:space-between;margin-top:40px">
      <div>${tip === 'ponuda' ? 'Ponudu izradio' : 'Robu izdao'}:<br><br>________________________</div>
      ${tip === 'otpremnica' ? '<div>Robu primio (potpis i pečat):<br><br>________________________</div>' : '<div>M.P.</div>'}</div></div>`;

  if (r.odobrenje && !confirm('Ovo je ODOBRENJE (povrat novca), a ne račun za isporuku. Ipak upisati količine kao stiglo?')) return;
  S.otp = r;

    const prepoznato = r.stavke.filter(s => s.knjiga).length;

      ${r.stavke.map((s, i) => `<tr style="${s.knjiga ? '' : 'background:#fef9c3'}"><td>${esc(s.naziv)}<br><span class="siv">${[s.barkod, s.sifra && 'šifra ' + s.sifra].filter(Boolean).map(esc).join(' · ')}</span></td>
        <td><select data-i="${i}" style="max-width:420px">
          ${s.knjiga && s.knjiga.ocjena === 1 ? `<option value="k" selected>✓ ${esc(s.knjiga.naziv)}</option>` : ''}
          ${s.prijedlozi.map((p, n) => `<option value="${n}" ${s.knjiga && s.knjiga.id === p.id && s.knjiga.ocjena !== 1 ? 'selected' : ''}>${esc(p.naziv)} (${Math.round(p.ocjena * 100)}%)</option>`).join('')}
          <option value="naziv" ${!s.knjiga && (s.prijedlozi.length || s.barkod) ? 'selected' : ''}>upiši po nazivu s računa</option><option value="x" ${!s.knjiga && !s.prijedlozi.length && !s.barkod ? 'selected' : ''}>— preskoči —</option></select></td>
        <td class="br"><input type="number" min="0" data-k="${i}" value="${s.kolicina}" style="width:70px"></td></tr>`).join('')}</tbody></table></div>
      <div class="traka"><button class="glavni" id="otpDodaj">Dodaj u Stiglo</button><button id="otpOdustani">Odustani</button></div></div>`;
    o.querySelectorAll('select[data-i]').forEach(sel => sel.onchange = () => {
      const s = r.stavke[sel.dataset.i];
      s.izbor = sel.value;
    });
    o.querySelectorAll('input[data-k]').forEach(inp => inp.onchange = () => r.stavke[inp.dataset.k].kolicina = Math.max(0, parseInt(inp.value) || 0));
    $('#otpOdustani').onclick = () => o.remove();
    $('#otpDodaj').onclick = () => {
      if (!S.primka) S.primka = [];
      let n = 0; const sifre = [];
      for (const s of r.stavke) {
        const izbor = s.izbor ?? (s.knjiga ? (s.knjiga.ocjena === 1 ? 'k' : String(s.prijedlozi.findIndex(p => p.id === s.knjiga.id))) : (s.prijedlozi.length || s.barkod ? 'naziv' : 'x'));
        if (izbor === 'x' || !(s.kolicina > 0)) continue;
        const k = izbor === 'k' ? s.knjiga : izbor === 'naziv' ? null : s.prijedlozi[+izbor];
        const st = k ? { naziv: k.naziv, barkod: k.barkod || '', knjiga_id: k.id, kolicina: s.kolicina }
          : { naziv: s.naziv, barkod: s.barkod || '', knjiga_id: null, kolicina: s.kolicina };
        const kljuc = st.barkod || st.naziv, post = S.primka.find(p => (p.barkod || p.naziv) === kljuc);
        if (post) post.kolicina += st.kolicina; else S.primka.push(st);
        n += st.kolicina;
        if (k && s.sifra) sifre.push({ id: k.id, sifra: s.sifra });
      }
      if (sifre.length) api('/api/knjige/sifre', { parovi: sifre });  // šifra nakladnika se zapamti za sljedeći račun
      spremiPrimku(); o.remove(); stranicaStiglo();
      poruka(`Upisano ${n} knjiga s računa. Provjeri pa "Rasporedi na narudžbe".`);
    };
  };
  document.body.appendChild(o);
  crtaj();
}
/* ------------------------------------------------ Obrasci za skeniranje: roditelji označe kvačice, skenirate hrpu, program napravi narudžbe.
   Na obrascu su 4 crna kvadrata (oznake za poravnanje) i niz malih kvadrata = broj obrasca. Sve je na točno
   određenom mjestu (u milimetrima), pa se na skenu (ili fotografiji) zna gdje je koja kućica. */
const OB = { oznake: [[3, 3], [187, 3], [187, 221], [3, 221]], bitX: 40, bitY: 1.5, bitW: 3, bitKorak: 4, bita: 24,
  kompletY: 49, knjigeY: 56, knjigeKraj: 190, polja: [0, 26, 190, 47], opcijePodrucje: [0, 192, 190, 212] };
const OB_OPCIJE = [{ k: 'ak_ne', x: 30, y: 195, t: 'NE' }, { k: 'ak_da', x: 45, y: 195, t: 'DA, iznos ________ €' },
  { k: 'gotovina', x: 122, y: 195, t: 'gotovina' }, { k: 'kartica', x: 150, y: 195, t: 'kartica' },
  { k: 'roditelj', x: 30, y: 203, t: 'roditelj' }, { k: 'grad', x: 58, y: 203, t: 'Grad' }, { k: 'czss', x: 79, y: 203, t: 'CZSS' },
  { k: 'zupanija', x: 101, y: 203, t: 'Županija' }];
function rasporedObrasca(n) {
  const red = Math.min(6, (OB.knjigeKraj - OB.knjigeY) / Math.max(1, n)), kutija = Math.min(4.2, red - 0.5);
  return { red, kutija, knjiga: i => ({ x: 3, y: OB.knjigeY + i * red + (red - kutija) / 2 }) };
}
const kontrola = id => ((id & 0xFF) * 31 + (id >> 8) * 17 + 0x5A) & 0xFF;
function bitoviObrasca(id) {
  const v = (id & 0xFFFF) * 256 + kontrola(id & 0xFFFF);
  return [...Array(OB.bita)].map((_, i) => Math.floor(v / 2 ** (OB.bita - 1 - i)) % 2);
}

        `width:129mm;line-height:${r.red}mm;height:${r.red}mm`) +

    }).join('');
    const opcije = OB_OPCIJE.map(o => kut(o.x, o.y, 4) + tekst(o.x + 5.5, o.y - 0.3, o.t, 'line-height:4.6mm')).join('');
    return `<div class="skob">${oznake}${bitovi}
      <div class="skt" style="left:0;top:7mm;width:110mm;display:flow-root"><img src="/logo.png" class="logo mali" style="height:11mm;margin-right:3mm" alt="" onerror="this.remove()"><b>${esc(p.firma)}</b><br>${esc(p.adresa)} · tel. ${esc(p.telefon)}</div>
      ${tekst(110, 7.5, `<b style="font-size:14px">NARUDŽBA UDŽBENIKA ${god}</b><br><span style="color:#555">obrazac br. ${k.obrazac_id} · ne pišite po crnim kvadratima</span>`, 'width:80mm;text-align:right')}
      ${tekst(0, 19.5, `<b style="font-size:13px">${esc(k.skola || '')} · ${esc(k.razred)}. RAZRED · ${esc(k.naziv)}</b>`, 'width:190mm')}
      ${tekst(0, 28, 'Ime i prezime roditelja:')}${crta(36, 32, 72)}${tekst(112, 28, 'Mobitel:')}${crta(125, 32, 65)}
      ${tekst(0, 37, 'Ime i prezime učenika:')}${crta(36, 41, 72)}${tekst(112, 37, 'Datum:')}${crta(125, 41, 65)}
      ${kut(3, OB.kompletY)}${tekst(10, OB.kompletY - 0.2, `<b>CIJELI KOMPLET</b> – sve knjige s popisa, ukupno <b>${kn(uk)}</b> &nbsp; <span style="color:#555">ili označite ✓ (ili ✗) samo knjige koje trebate:</span>`, 'line-height:4.6mm;width:180mm')}
      ${knjige}

      <div class="skt" style="left:0;top:228mm;width:190mm;border-top:1.5px dashed #000;padding-top:1.5mm">
        <span style="position:absolute;top:-3.2mm;left:-1mm;background:#fff;font-size:13px">✂</span>
        <div style="display:flex;justify-content:space-between;gap:12px"><div><b>${esc(p.firma)}</b> · tel. ${esc(p.telefon)}<br>POTVRDA O NARUDŽBI udžbenika ${god}<br>
          ${esc(k.skola || '')} · ${esc(k.razred)}. r. · ${esc(k.naziv)}</div>
          <div style="line-height:2">Br. narudžbe: ________<br>Kupac: ____________________<br>Akontacija: ________ € &nbsp; Datum: __________</div></div>
        <div style="color:#555">Javit ćemo Vam se kad knjige stignu. Ponesite ovu potvrdu.</div></div>

/* --- prepoznavanje na skenu --- */
function homografija(od, na) {  // od: točke u mm, na: točke u pikselima (4 para) -> funkcija mm -> px
  const A = [], b = [];

    for (let i = 0; i < platna.length; i++) {
      status(`Prepoznajem ${f.name}, stranica ${i + 1} od ${platna.length}…`);
      await new Promise(r => setTimeout(r, 0));
      const r = procitajSken(platna[i]);

      else Object.assign(st, { id: r.id, r });
      stranice.push(st);
      platna[i].width = platna[i].height = 0;  // oslobodi memoriju
    }
  }
  const ids = [...new Set(stranice.filter(s => s.id).map(s => s.id))];
  const obrasci = ids.length ? await api('/api/obrasci/skenirani', { ids }) : {};
  for (const s of stranice.filter(s => s.id)) {

  else if (naNarudzbi && e.ctrlKey && e.key.toLowerCase() === 's') { e.preventDefault(); spremiNarudzbu(); }
});
ucitajOsnovno().then(ruta);
